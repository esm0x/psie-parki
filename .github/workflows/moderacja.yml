name: Moderacja zgłoszeń

# Submissions from the app arrive as issues opened by the worker's account (see
# MODERACJA.md). This decides them, republishes data/parks.json, then comments,
# labels and closes each issue. Every half hour as well, so an event GitHub drops
# only delays a submission, never loses it.

on:
  issues:
    types: [opened]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# Same group as the weekly data job: both rewrite data/parks.json.
concurrency:
  group: dane
  cancel-in-progress: false

jobs:
  moderate:
    # Dormant until ZGLOSZENIA_BOT is set (MODERACJA.md, step 2). Then only issues the
    # worker opened with its label; anything else is not a submission.
    if: >-
      vars.ZGLOSZENIA_BOT != '' &&
      (github.event_name != 'issues' || (contains(github.event.issue.labels.*.name, 'zgloszenie') && github.event.issue.user.login == vars.ZGLOSZENIA_BOT))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZGLOSZENIA_BOT: ${{ vars.ZGLOSZENIA_BOT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Decyzje
        run: python scraper/moderuj.py decyduj --wyniki "$RUNNER_TEMP/wyniki.json"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual/zgloszenia.json data/parks.json
          if git diff --cached --quiet; then
            echo "Bez zmian."
          else
            git commit -m "chore(zgloszenia): moderacja zgłoszeń z aplikacji"
            git push
          fi

      - name: Komentarze i zamknięcie
        run: python scraper/moderuj.py oglos --wyniki "$RUNNER_TEMP/wyniki.json"
