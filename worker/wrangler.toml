# Cloudflare Worker that takes submissions from the app (free plan). Setup: MODERACJA.md.
name = "psie-parki-zgloszenia"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "esm0x/psie-parki"

# npx wrangler kv namespace create LIMITS  → paste the id here
[[kv_namespaces]]
binding = "LIMITS"
id = "UZUPELNIJ_PO_UTWORZENIU"

# Bursts: 5 submissions a minute per network, enforced by Cloudflare, free.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets, never in this file:
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put HASH_SECRET
